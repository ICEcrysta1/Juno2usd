[workspace]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.lints.clippy]
await_holding_lock = "deny"
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

[package]
name = "juno2usd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
openusd = { workspace = true }
openusd-schemas = { workspace = true }
roxmltree = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
ratatui = { workspace = true }
notify = { workspace = true }

[workspace.dependencies]
# USD 原生 Rust 实现（无 C++ 依赖）：usda/usdc/usdz 读写 + Stage API
openusd = "0.9"
# 类型化 schema：UsdGeom / UsdShade / UsdSkel，恰为本项目所需三族
openusd-schemas = { version = "0.9", features = ["geom", "shade", "skel"] }
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.2.0"
# TUI 框架（crossterm 经 ratatui 重导出，不单独引依赖）
ratatui = "0.29"
# Input 目录事件监听（Windows ReadDirectoryChangesW，事件推送非轮询）
notify = "9.0.0"
